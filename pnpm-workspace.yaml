packages:
  - '.'
# Supply-chain policy (janitor DEP-001 / PKGPOL-001): refuse dependency releases younger than
# 5 days (7200 min), refuse a version whose publish trust level is lower than an earlier one,
# refuse transitive deps from git/tarball URLs, and fail the install on unreviewed build scripts.
minimumReleaseAge: 7200
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true

# Transitive (express via the MCP SDK) versions with published CVEs; force the patched releases.
# path-to-regexp 8.2.0: CVE-2026-4923, CVE-2026-4926 (fixed in 8.4.0).
# qs 6.14.0: CVE-2025-15284, CVE-2026-82417, CVE-2026-8723, CVE-2026-2391 (fixed in 6.16.0).
# Remove an entry once the MCP SDK / express resolve a patched version on their own.
overrides:
  path-to-regexp: ^8.4.2
  qs: ^6.16.0

# Reviewed exceptions for the lockfile as of 2026-10-01 (pnpm install --frozen-lockfile verifies the
# lockfile against the policy above). Each is a deliberate Dependabot-era upgrade that was published
# less than 5 days before the first release; the age exceptions stop mattering after 2026-10-04 and
# SHOULD be deleted then. The trust-downgrade entries are the only versions the lockfile resolves
# for an old transitive dev dependency (semver 6.x via babel/jest, undici-types 6.x via @types/node 22).
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.31.0'
  - '@hono/node-server@2.1.3'
  - 'hono@4.13.11'
  - 'typescript-eslint@8.71.0'
  - '@typescript-eslint/eslint-plugin@8.71.0'
  - '@typescript-eslint/parser@8.71.0'
  - '@typescript-eslint/project-service@8.71.0'
  - '@typescript-eslint/scope-manager@8.71.0'
  - '@typescript-eslint/tsconfig-utils@8.71.0'
  - '@typescript-eslint/type-utils@8.71.0'
  - '@typescript-eslint/types@8.71.0'
  - '@typescript-eslint/typescript-estree@8.71.0'
  - '@typescript-eslint/utils@8.71.0'
  - '@typescript-eslint/visitor-keys@8.71.0'
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
# esbuild and unrs-resolver are transitive dev-tooling deps whose postinstall
# build scripts are not needed: tsc, eslint, jest, and the build all pass
# without running them (verified locally with pnpm 9 and pnpm 12.6; pnpm 9 ignores allowBuilds).
allowBuilds:
  # @parcel/watcher: native fs-watcher used by jest-haste-map (jest 30.5+) only in
  # --watch mode; this repo runs jest non-watch, so the postinstall build is unneeded.
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
