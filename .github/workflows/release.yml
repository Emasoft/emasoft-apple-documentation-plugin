name: Release

# Fires on a version tag pushed by scripts/publish.py. This plugin is distributed
# through the Emasoft/emasoft-plugins marketplace (Claude Code clones the repo at
# the tag); it is NOT published to npm or any other package registry, so there is
# deliberately no registry-publish step and no registry token here.

on:
  push:
    # Excludes the upstream v0.x/v1.x tags this repo still carries: only v2 and later can start a release.
    tags:
      - 'v[2-9].*.*'
      - 'v[1-9][0-9]+.*.*'

permissions: {}

jobs:
  # Validation and tests are gates on the same commit and neither consumes the
  # other's result, so they run concurrently. The release job needs
  # validation-report.txt (a release asset), so the validate job hands it over
  # as an artifact.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Validation budget, not a build budget: do not lower it below 25.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No caches in a tag-triggered release workflow (zizmor cache-poisoning): a
          # restorable cache must not feed the job that publishes release assets.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Run full plugin validation (remote CPV, --strict)
        # CPV is pinned to the same tag ci.yml and publish.py use. Any exit code
        # outside 1-4 means the validator failed to run, which must fail the
        # release rather than publish an unvalidated tag.
        env:
          PLUGIN_SKIP_GITHUB_INTEGRITY: "1"
          PLUGIN_REPO_LINT_PHASE_TIMEOUT: "600"
        run: |
          set +e
          PYTHONUNBUFFERED=1 uvx --from git+https://github.com/Emasoft/claude-plugins-validation@v5.22.0 \
              --with pyyaml \
              cpv-remote-validate plugin . --strict \
              2>&1 | tee "validation-report.txt"
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "Validation passed"
            exit 0
          fi
          if [ "$exit_code" -ge 1 ] && [ "$exit_code" -le 4 ] \
             && grep -q "SUMMARY: CRITICAL=" "validation-report.txt"; then
            echo "::error::Validation failed (exit $exit_code: CRITICAL/MAJOR/MINOR/NIT found)"
            exit "$exit_code"
          fi
          echo "::error::CPV validator FAILED TO RUN (exit $exit_code) - infra/network/install failure, NOT a validation verdict."
          exit 1

      - name: Upload validation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-report
          path: validation-report.txt
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    # Ubuntu only on purpose: ci.yml already ran the ubuntu + macOS matrix on
    # this commit, so macOS here buys no coverage and costs wall clock.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # No caching in a tag-triggered release workflow (zizmor cache-poisoning).
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches the manifests
        # plugin.json is what Claude Code reads for updates and package.json is
        # what the server reports: both must equal the tag being released.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          plugin="v$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$pkg" != "$TAG" ] || [ "$plugin" != "$TAG" ]; then
            echo "::error::tag $TAG, package.json $pkg, plugin.json $plugin must all be equal"
            exit 1
          fi
          echo "Version check passed: $TAG"

      - name: Run tests
        run: pnpm test

  release:
    name: Release
    runs-on: ubuntu-latest
    # Fail-closed: the release is cut only if validation and tests both passed.
    # No `if: always()` on purpose: a release must not proceed on a red gate.
    needs: [validate, test]
    timeout-minutes: 15
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC token for build-provenance attestation
      attestations: write   # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog step walks back to the previous tag.
          fetch-depth: 0
          # `gh release` authenticates via GH_TOKEN and nothing here pushes.
          persist-credentials: false

      - name: Download validation report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-report

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Generate release notes
        id: changelog
        # Extract ONLY the matching "## [X.Y.Z] - date" block from CHANGELOG.md
        # (em-dash canonical, hyphen legacy); fall back to a bounded git log.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            GITLOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            GITLOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD")
          fi
          if [ -f "CHANGELOG.md" ]; then
            SECTION=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\] [—-] " {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION" > changelog.txt
              echo "::notice::Release body extracted from CHANGELOG.md section for $VERSION"
            else
              echo "::warning::No CHANGELOG.md section matched ## [$VERSION] - falling back to the git log since $PREV_TAG"
              printf '%s\n' "$GITLOG" > changelog.txt
            fi
          else
            echo "$GITLOG" > changelog.txt
          fi
          echo "changelog_file=changelog.txt" >> "$GITHUB_OUTPUT"

      - name: Compute per-asset SHA256SUMS
        run: |
          set -e
          : > SHA256SUMS
          for f in validation-report.txt sbom.spdx.json; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS
            fi
          done
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Create or update GitHub Release (idempotent)
        # publish.py may already have created the release locally (stage 15), so
        # edit in place when it exists instead of failing with a 422.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - editing in place"
            gh release edit "$TAG" --notes-file changelog.txt --verify-tag
            gh release upload "$TAG" validation-report.txt sbom.spdx.json SHA256SUMS --clobber
          else
            echo "Release $TAG does not exist yet - creating"
            gh release create "$TAG" validation-report.txt sbom.spdx.json SHA256SUMS \
              --title "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            validation-report.txt
            sbom.spdx.json
