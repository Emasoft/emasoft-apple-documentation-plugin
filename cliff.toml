# git-cliff configuration for changelog generation
# https://git-cliff.org

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}\
    {% endfor %}
{% endfor %}
"""
footer = """
---
*Generated by [git-cliff](https://git-cliff.org)*
"""
trim = true
postprocessors = [
  { pattern = '(?m)(^|[^\w`])@([A-Za-z0-9][A-Za-z0-9-]{0,38})([^\w/]|$)', replace = "${1}`@${2}`${3}" },
  { pattern = '(?m)(^|[^\w`])@([A-Za-z0-9][A-Za-z0-9-]{0,38})([^\w/]|$)', replace = "${1}`@${2}`${3}" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  # Four commits inherited from kimsungwhee/apple-docs-mcp carry UPSTREAM PR numbers. The generic rule below
  # would link them to THIS repo issues, which is wrong, so each one is rewritten to an upstream link first.
  # They are anchored on the subject text, because a bare number rule would also capture this repo own PRs.
  { pattern = 'tool understanding \(#34\)', replace = "tool understanding ([upstream #34](https://github.com/kimsungwhee/apple-docs-mcp/issues/34))" },
  { pattern = 'sync Korean README with English version \(#35\)', replace = "sync Korean README with English version ([upstream #35](https://github.com/kimsungwhee/apple-docs-mcp/issues/35))" },
  { pattern = 'add alarmkit support \(#31\)', replace = "add alarmkit support ([upstream #31](https://github.com/kimsungwhee/apple-docs-mcp/issues/31))" },
  { pattern = 'avoid GitHub rate limits \(#3\)', replace = "avoid GitHub rate limits ([upstream #3](https://github.com/kimsungwhee/apple-docs-mcp/issues/3))" },
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Emasoft/emasoft-apple-documentation-plugin/issues/${2}))" },
  { pattern = '\s+$', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^release", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
